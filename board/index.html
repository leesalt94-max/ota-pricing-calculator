<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>레이트 데스크 비교판</title>
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
<style>
/* 레이아웃: 상단 얇은 바(요약 · 월 운영 설정 · 보기) 아래 OTA 카드 3장만. 카드 안에서 가격·프로모션·가중치·청소비·인원 추가·숙박 예시를 모두 다룸 */
:root {
  --bg: #EEF1F4; --card: #FFFFFF; --well: #F5F7F9; --ink: #191F28; --sub: #4E5968; --faint: #6B7684; --line: #E1E5EA;
  --accent: #0E6B5C; --accent-ink: #0A5246; --accent-soft: #E3F1EE;
  --gold-bg: #FBF6EC; --gold-line: #EAD9B8; --gold-ink: #6B4708;
  --warn-bg: #FDF0EC; --warn-ink: #9A3B26; --good-ink: #17643A; --good-bg: #E6F4EC;
  --ab: #D9485F; --ab-soft: #FBE9EC; --ab-chip: #F3AFAF; --ab-chip-ink: #7A2020;
  --bk: #1D3F75; --bk-soft: #E7EDF7; --bk-chip: #14315C; --bk-chip-ink: #FFFFFF;
  --tr: #1F7FA6; --tr-soft: #E4F2F8; --tr-chip: #A9D8ED; --tr-chip-ink: #133F52;
  --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161B; --card: #1A1F26; --well: #20262E; --ink: #E8ECF1; --sub: #AEB6C1; --faint: #8A94A1; --line: #2C333C;
    --accent: #4FBFA8; --accent-ink: #7AD6C2; --accent-soft: #173A33;
    --gold-bg: #2E2717; --gold-line: #5A4A26; --gold-ink: #E9C987;
    --warn-bg: #3A2019; --warn-ink: #F2A48E; --good-ink: #7FD6A3; --good-bg: #183225;
    --ab: #F07C8E; --ab-soft: #2E1C21; --ab-chip: #6E2A33; --ab-chip-ink: #FFD9DE;
    --bk: #8FB1EA; --bk-soft: #19233A; --bk-chip: #2B4C86; --bk-chip-ink: #FFFFFF;
    --tr: #6CC1E3; --tr-soft: #152A33; --tr-chip: #1F5268; --tr-chip-ink: #D4EFFA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161B; --card: #1A1F26; --well: #20262E; --ink: #E8ECF1; --sub: #AEB6C1; --faint: #8A94A1; --line: #2C333C;
  --accent: #4FBFA8; --accent-ink: #7AD6C2; --accent-soft: #173A33;
  --gold-bg: #2E2717; --gold-line: #5A4A26; --gold-ink: #E9C987;
  --warn-bg: #3A2019; --warn-ink: #F2A48E; --good-ink: #7FD6A3; --good-bg: #183225;
  --ab: #F07C8E; --ab-soft: #2E1C21; --ab-chip: #6E2A33; --ab-chip-ink: #FFD9DE;
  --bk: #8FB1EA; --bk-soft: #19233A; --bk-chip: #2B4C86; --bk-chip-ink: #FFFFFF;
  --tr: #6CC1E3; --tr-soft: #152A33; --tr-chip: #1F5268; --tr-chip-ink: #D4EFFA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; display: grid; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.small { font-size: 11.5px; color: var(--faint); }
.note { font-size: 11.5px; color: var(--faint); margin: 0; }

/* 상단바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.brand { font-weight: 800; font-size: 15px; }
.brand small { font-weight: 600; color: var(--faint); font-size: 12px; margin-left: 6px; }
.summary { margin-right: auto; font-size: 12.5px; color: var(--sub); }
.summary b { color: var(--ink); }
.grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.grp > .lbl { font-size: 11.5px; color: var(--faint); font-weight: 600; }
.seg { display: inline-flex; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--well); }
.stepper button { border: 0; background: none; width: 26px; height: 26px; font-weight: 700; color: var(--sub); }
.stepper span { min-width: 64px; text-align: center; font-weight: 700; font-size: 12.5px; }
.pillbtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--sub); }
.pillbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.pillbtn.toggle[aria-pressed="true"]::before { content: "✓ "; }
.drawerbtn { border: 1px solid var(--line); background: var(--well); border-radius: 8px; padding: 5px 11px; font-weight: 700; font-size: 12.5px; }
.drawerbtn[aria-expanded="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }

/* 월 운영 설정 서랍 */
.drawer { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
.drawer h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 800; }
.dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.costs { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
.cost { background: var(--well); border-radius: 8px; padding: 6px; display: grid; gap: 5px; }
.cost-r { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 5px; }
.cost-r2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cost .inp { background: var(--card); }

/* 입력 */
label.fl { display: grid; gap: 3px; font-size: 11.5px; color: var(--faint); font-weight: 600; min-width: 0; }
.inp { display: flex; align-items: center; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; min-width: 0; }
.inp:focus-within { border-color: var(--accent); background: var(--card); }
.inp input, .inp select { border: 0; background: transparent; width: 100%; min-width: 0; padding: 5px 0; text-align: right; font-size: 13px; font-weight: 600; color: var(--ink); outline: none; }
.inp select { text-align: left; }
.inp span { font-size: 12px; color: var(--faint); margin-left: 4px; white-space: nowrap; }
.inp.txt input { text-align: left; font-weight: 500; }
.inp.price { background: var(--card); padding: 0 10px; }
.inp.price input { font-size: 28px; font-weight: 800; padding: 4px 0; letter-spacing: -0.02em; }
.gbig { display: grid; gap: 0; background: var(--card); border-radius: 8px; padding: 4px 10px 6px; border: 1px solid transparent; }
.gbig .k { font-size: 11.5px; color: var(--faint); font-weight: 600; }
.gbig .v { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; text-align: right; line-height: 1.2; }
.gbig .s { font-size: 11px; color: var(--faint); text-align: right; }
.gbig .xp { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); display: grid; gap: 0; text-align: right; }
.gbig .xp .xk { font-size: 11.5px; font-weight: 700; color: var(--accent-ink); }
.gbig .xp .xv { font-size: 17px; font-weight: 800; }
.gbig .xp .xs { font-size: 11px; color: var(--faint); }
.inp.price.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { background: var(--gold-bg); border-color: var(--gold-line); } 100% { background: var(--card); } }
.chk { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--sub); }
.chk input { margin: 0; accent-color: var(--accent); }
.del { border: 0; background: none; color: var(--faint); font-size: 12px; padding: 2px 5px; border-radius: 4px; }
.del:hover { color: var(--warn-ink); background: var(--warn-bg); }
.add { border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 5px; font-size: 12px; color: var(--sub); font-weight: 600; }
.add:hover { border-color: var(--accent); color: var(--accent-ink); }

/* 카드 */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.card.anchor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.c-head { padding: 10px 14px 12px; display: grid; gap: 10px; }
.card.ab .c-head { background: var(--ab-soft); }
.card.bk .c-head { background: var(--bk-soft); }
.card.tr .c-head { background: var(--tr-soft); }
.c-name { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.c-name .tags { margin-left: auto; display: flex; gap: 4px; }
.chip { display: inline-grid; place-items: center; width: 28px; height: 21px; border-radius: 5px; font-size: 10.5px; font-weight: 800; flex: none; }
.chip.ab { background: var(--ab-chip); color: var(--ab-chip-ink); }
.chip.bk { background: var(--bk-chip); color: var(--bk-chip-ink); }
.chip.tr { background: var(--tr-chip); color: var(--tr-chip-ink); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
.tag.solid { background: var(--accent); color: var(--card); }
.tag.gold { background: var(--gold-bg); color: var(--gold-ink); border: 1px solid var(--gold-line); }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
.tag.good { background: var(--good-bg); color: var(--good-ink); }
.tag.plain { background: var(--card); color: var(--sub); border: 1px solid var(--line); }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pcol { display: grid; gap: 4px; min-width: 0; }
.pmeta { display: grid; gap: 1px; font-size: 12px; color: var(--sub); }
.pmeta div { display: flex; justify-content: space-between; gap: 6px; }
.pmeta b { color: var(--ink); }
.final { background: var(--card); border-radius: 10px; padding: 9px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.final .k { font-size: 12px; font-weight: 700; color: var(--accent-ink); }
.final .v { font-size: 26px; font-weight: 800; color: var(--accent-ink); letter-spacing: -0.02em; }
.final .side { grid-row: 1 / span 2; grid-column: 2; display: grid; gap: 4px; justify-items: end; }
.final .sub { font-size: 11.5px; color: var(--sub); }
.weight { display: flex; align-items: center; gap: 8px; }
.weight .inp { width: 92px; background: var(--card); }
.weight .small { flex: 1; }

.c-body { display: grid; }
.sec { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px; }
.sec-h { display: flex; align-items: center; gap: 8px; }
.sec-h h3 { margin: 0; font-size: 12px; font-weight: 800; color: var(--sub); letter-spacing: .02em; }
.sec-h .right { margin-left: auto; font-size: 12px; font-weight: 700; }
.promo { display: grid; grid-template-columns: auto minmax(0, 1fr) 76px auto; gap: 6px; align-items: center; }
.promo.fund { grid-template-columns: auto minmax(0, 1fr) 88px 76px auto; }
.promo .inp select { font-size: 12px; font-weight: 600; padding: 4px 0; }
.topin { width: 74px; }
.promo.off .inp { opacity: .55; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.calc { font-size: 11.5px; color: var(--sub); background: var(--well); border-radius: 7px; padding: 5px 8px; }
.calc b { color: var(--ink); }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { font-size: 11px; color: var(--faint); font-weight: 700; text-align: right; padding: 0 0 4px; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { padding: 4px 0; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
table.t td:first-child { color: var(--sub); white-space: normal; }
table.t td .s { display: block; font-size: 10.5px; color: var(--faint); }
table.t tr.minus td:not(:first-child) { color: var(--warn-ink); }
table.t tr.tot td { font-weight: 800; color: var(--ink); }
table.t td.hi { font-weight: 800; color: var(--accent-ink); }

body.hide-promo .v-promo, body.hide-extra .v-extra, body.hide-stay .v-stay, body.hide-process .v-process, body.hide-monthly .v-monthly, body.hide-tax .v-tax { display: none !important; }

@media (max-width: 1250px) { .cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 820px) { .cards { grid-template-columns: minmax(0, 1fr); } .drawer { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .inp.price.flash { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar" id="topbar"></header>
  <section class="drawer" id="drawer" hidden></section>
  <div class="cards" id="cards"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 세금 상수 (기존 레이트 데스크와 동일) ---------- */
  var EXPENSE_RATIOS = { simple: 84.6, standard: 17.3 };
  var BOOKKEEPING_LIMIT = 150000000, SIMPLE_RATIO_LIMIT = 36000000, SIMPLIFIED_VAT_THRESHOLD = 104000000, VAT_EXEMPT_THRESHOLD = 48000000;
  var SIMPLIFIED_VALUE_ADDED_RATE = 0.25, WHT_RATE = 0.033;
  var TAX_BRACKETS = [
    { limit: 14000000, rate: 0.06, deduction: 0 }, { limit: 50000000, rate: 0.15, deduction: 1260000 },
    { limit: 88000000, rate: 0.24, deduction: 5760000 }, { limit: 150000000, rate: 0.35, deduction: 15440000 },
    { limit: 300000000, rate: 0.38, deduction: 19940000 }, { limit: 500000000, rate: 0.40, deduction: 25940000 },
    { limit: 1000000000, rate: 0.42, deduction: 35940000 }, { limit: Infinity, rate: 0.45, deduction: 65940000 }
  ];
  var STORE_KEY = "rate-board-v8";
  var CH_KEYS = ["airbnb", "booking", "trip"];
  var VIEWS = [["promo", "프로모션·수수료"], ["extra", "청소비·인원"], ["stay", "숙박 예시"], ["process", "1박 계산 과정"], ["monthly", "월 수익 내역"], ["tax", "세금 상세"]];

  function defaults() {
    return {
      anchor: "airbnb", aWd: 143000, aWe: 190500,       // 마지막으로 가격을 입력한 OTA와 그 가격
      basePeople: 4, maxPeople: 8,
      nights: { weekday: 16, weekend: 8 }, avgLOS: 2, roundUnit: 100, cleanPromo: false,
      avgExtra: 0,                                       // 한 달 평균 추가 인원 (1박당)
      channels: {
        airbnb:  { label: "에어비앤비", code: "AB", cls: "ab", commission: 15.5, processing: 0, weight: 0, stack: "multiply", cleaningFee: 50000, extraFee: 20000, cleanComm: true,
                   promos: [{ name: "조기예약 할인", rate: 5, on: true }, { name: "막바지 할인", rate: 15, on: false }] },
        booking: { label: "부킹닷컴", code: "BK", cls: "bk", commission: 15, processing: 2.5, weight: 5, stack: "multiply", cleaningFee: 50000, extraFee: 20000, cleanComm: true,
                   promos: [{ name: "모바일 할인", rate: 10, on: true }, { name: "지니어스 할인", rate: 10, on: true }, { name: "막바지 할인", rate: 15, on: false }] },
        trip:    { label: "트립닷컴", code: "TR", cls: "tr", commission: 15, processing: 0, weight: 8, stack: "add", cleaningFee: 50000, extraFee: 20000, cleanComm: false,
                   promos: [{ name: "모바일 할인", rate: 10, on: true, funder: "host" }, { name: "회원 할인", rate: 15, on: true, funder: "host" }, { name: "막바지 할인", rate: 15, on: false, funder: "host" }, { name: "특별 할인", rate: 9.6, on: false, funder: "ota" }] }
      },
      costs: [
        { name: "월세", amount: 800000, unit: "month", proof: true, wht: false },
        { name: "전기·가스 (예시)", amount: 150000, unit: "month", proof: false, wht: false },
        { name: "수도 (예시)", amount: 30000, unit: "month", proof: false, wht: false },
        { name: "인터넷·OTT (예시)", amount: 35000, unit: "month", proof: false, wht: false },
        { name: "청소 인건비", amount: 50000, unit: "clean", proof: true, wht: false },
        { name: "어메니티·소모품 (예시)", amount: 5000, unit: "clean", proof: true, wht: false }
      ],
      ex: { day: "weekday", people: 4 },
      drawer: false,
      view: { promo: true, extra: true, stay: true, process: false, monthly: true, tax: false }
    };
  }
  function load() {
    var d = defaults();
    try {
      var raw = localStorage.getItem(STORE_KEY); if (!raw) return d;
      var s = JSON.parse(raw), out = Object.assign(d, s);
      ["nights", "ex", "view"].forEach(function (k) { out[k] = Object.assign(defaults()[k], s[k] || {}); });
      return out;
    } catch (e) { return d; }
  }
  var state = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------- 포맷 ---------- */
  function comma(n) { return isFinite(n) && n != null ? Math.round(n).toLocaleString("ko-KR") : "—"; }
  function won(n) { return isFinite(n) && n != null ? comma(n) + "원" : "—"; }
  function man(n) { return (Math.round(n / 10000)).toLocaleString("ko-KR") + "만"; }
  function pct(n) { return (Math.round(n * 10) / 10).toLocaleString("ko-KR") + "%"; }
  function signed(n) { var r = Math.round(n); return (r > 0 ? "+" : r < 0 ? "−" : "±") + comma(Math.abs(r)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function parseNum(v) { var n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; }
  function roundTo(v) { var u = +state.roundUnit || 1; return isFinite(v) ? Math.round(v / u) * u : v; }

  /* ---------- 수수료 · 프로모션 ---------- */
  function effComm(ch) { return (+ch.commission || 0) + (+ch.processing || 0); }
  // 곱연산(에어비앤비·부킹): 1 − Π(1 − 할인) / 합산(트립): 할인율을 더해 한 번에
  // hostOnly: 숙소가 부담하는 할인만 (트립닷컴이 부담하는 쿠폰은 게스트 결제가만 낮추고 정산액엔 영향 없음)
  // 트립닷컴(화면 확인): 숙소 할인은 모두 게시가 기준으로 더해서 한 번에 빼고, 트립 쿠폰(특별 할인)은 그 다음에 따로 빠짐
  //   게스트 객실 결제 = 게시가 × (1 − Σ숙소 할인) × (1 − 트립 쿠폰)   ·  정산 = 게시가 × (1 − Σ숙소 할인) + 청소비
  function dfOf(ch, hostOnly) {
    var on = ch.promos.filter(function (p) { return p.on; });
    var host = on.filter(function (p) { return p.funder !== "ota"; }), ota = on.filter(function (p) { return p.funder === "ota"; });
    var hf = ch.stack === "add"
      ? Math.max(0.01, 1 - host.reduce(function (a, p) { return a + (+p.rate || 0); }, 0) / 100)
      : host.reduce(function (a, p) { return a * (1 - (+p.rate || 0) / 100); }, 1);
    if (hostOnly) return hf;
    return hf * ota.reduce(function (a, p) { return a * (1 - (+p.rate || 0) / 100); }, 1);
  }
  function discountFactor(ch) { return dfOf(ch, false); }
  function hostFactor(ch) { return dfOf(ch, true); }
  function keepRate(ch) { return hostFactor(ch) * (1 - effComm(ch) / 100); }
  // guest: 게스트 결제가 / base: 정산 기준액(수수료가 붙는 금액, 매출) / net: 내 순수익
  function nightly(ch, price) {
    var df = discountFactor(ch), hf = hostFactor(ch), g = price * df, base = price * hf, f = base * effComm(ch) / 100;
    return { price: price, df: df, hf: hf, guest: g, base: base, fee: f, net: base - f };
  }
  function cleaning(ch) {
    var cf = +ch.cleaningFee || 0, g = cf * (state.cleanPromo ? discountFactor(ch) : 1), base = cf * (state.cleanPromo ? hostFactor(ch) : 1);
    var f = ch.cleanComm === false ? 0 : base * effComm(ch) / 100;
    return { price: cf, guest: g, base: base, fee: f, net: base - f };
  }
  function cleanings() { var n = state.nights; return state.avgLOS > 0 ? Math.round((+n.weekday + +n.weekend) / state.avgLOS) : 0; }

  /* ---------- 운영 비용 · 세금 ---------- */
  function costTotals() {
    var b = cleanings(), total = 0, proof = 0;
    // 묶음: 청소 1회 단위 → 청소 / 이름에 월세·임대·임차 → 월세 / 나머지 → 공과금·기타
    var groups = { rent: { sum: 0, names: [] }, util: { sum: 0, names: [] }, clean: { sum: 0, names: [] } };
    state.costs.forEach(function (ci) {
      var a = parseNum(ci.amount), g = ci.proof && ci.wht ? a / (1 - WHT_RATE) : a;
      var m = ci.unit === "year" ? g / 12 : ci.unit === "clean" ? g * b : g;
      total += m; if (ci.proof) proof += m;
      var gk = ci.unit === "clean" ? "clean" : /월세|임대|임차/.test(ci.name) ? "rent" : "util";
      groups[gk].sum += m;
      if (m > 0) groups[gk].names.push(String(ci.name).replace(/\s*\(예시\)/, "") + " " + comma(m));
    });
    return { monthly: total, proof: proof, bookings: b, groups: groups };
  }
  function incomeTax(x) { if (x <= 0) return 0; var b = TAX_BRACKETS.find(function (b) { return x <= b.limit; }); return Math.max(0, x * b.rate - b.deduction); }
  function taxOf(G, F, C, CP) {
    var t = { gross: G };
    t.taxType = G < SIMPLIFIED_VAT_THRESHOLD ? "simplified" : "general";
    if (t.taxType === "simplified") { t.vatExempt = G < VAT_EXEMPT_THRESHOLD; t.vat = t.vatExempt ? 0 : G * SIMPLIFIED_VALUE_ADDED_RATE * 0.1; t.revenue = G - t.vat; }
    else { t.vatExempt = false; t.revenue = G / 1.1; t.vat = G - t.revenue; }
    t.method = t.revenue < SIMPLE_RATIO_LIMIT ? "simple" : "standard";
    t.expenseRatio = EXPENSE_RATIOS[t.method];
    t.ratioExpense = t.revenue * t.expenseRatio / 100;
    t.costExpense = t.method === "standard" ? CP : 0;
    t.income = Math.max(0, t.revenue - t.ratioExpense - t.costExpense);
    t.capMult = t.revenue < BOOKKEEPING_LIMIT ? 2.8 : 3.4;
    t.capIncome = t.revenue * (1 - EXPENSE_RATIOS.simple / 100) * t.capMult;
    t.capApplied = t.method === "standard" && t.capIncome < t.income;
    if (t.capApplied) t.income = t.capIncome;
    t.calcTax = incomeTax(t.income);
    t.penalty = t.method === "standard" && G >= VAT_EXEMPT_THRESHOLD ? t.calcTax * 0.2 : 0;
    t.incomeTax = t.calcTax + t.penalty;
    t.localTax = t.incomeTax * 0.1;
    t.totalTax = t.vat + t.incomeTax + t.localTax;
    t.afterTax = G - F - C - t.totalTax;
    return t;
  }
  // 한 달 판매 박수를 그 OTA에서 모두 팔았을 때 (기준 인원)
  function monthly(key, wd, we, xFee) {
    var ch = state.channels[key], n = state.nights, a = nightly(ch, wd), b = nightly(ch, we), ct = costTotals(), cl = cleaning(ch);
    var x = nightly(ch, xFee || 0), xN = (+n.weekday + +n.weekend) * (+state.avgExtra || 0);   // 한 달 추가 인원·박
    var m = { wdB: a, weB: b, bookings: ct.bookings, clean: cl, costs: ct.monthly, costGroups: ct.groups, xN: xN };
    m.cleanGuest = cl.guest * ct.bookings;
    m.extraGuest = x.guest * xN;
    m.guest = n.weekday * a.guest + n.weekend * b.guest + m.cleanGuest + m.extraGuest;
    m.revenue = n.weekday * a.base + n.weekend * b.base + cl.base * ct.bookings + x.base * xN;
    m.fee = n.weekday * a.fee + n.weekend * b.fee + cl.fee * ct.bookings + x.fee * xN;
    m.tax = taxOf(m.revenue * 12, m.fee * 12, ct.monthly * 12, ct.proof * 12);
    m.vat = m.tax.vat / 12; m.incomeTax = (m.tax.incomeTax + m.tax.localTax) / 12; m.final = m.tax.afterTax / 12;
    return m;
  }
  // 목표 월 최종 순수익 이상이 되는 가장 낮은 평일 게시가 (주말은 기준 OTA의 주말/평일 비율)
  function solve(key, target, ratio, xFee) {
    var unit = +state.roundUnit || 100, coarse = Math.max(unit, 1000);
    function f(p) { return monthly(key, p, roundTo(p * ratio), xFee).final; }
    for (var p = coarse; p <= 3000000; p += coarse) {
      if (f(p) >= target) { for (var q = Math.max(unit, p - coarse + unit); q <= p; q += unit) if (f(q) >= target) return q; return p; }
    }
    return null;
  }
  function wMul(key) { return 1 + (+state.channels[key].weight || 0) / 100; }

  var last = null;
  function computeAll() {
    var A = state.anchor, ratio = state.aWe / Math.max(1, state.aWd);
    var xFees = {};   // 1인 추가 요금은 OTA마다 따로 입력 (연동하지 않음)
    CH_KEYS.forEach(function (k) { xFees[k] = +state.channels[k].extraFee || 0; });
    var base = monthly(A, +state.aWd, +state.aWe, xFees[A]);
    var baseCore = base.final / wMul(A);                     // 가중치 0 기준 순수익
    var out = { base: base, baseCore: baseCore, ch: {} };
    CH_KEYS.forEach(function (k) {
      var r = { key: k, ch: state.channels[k], xFee: xFees[k] };
      if (k === A) { r.wd = +state.aWd; r.we = +state.aWe; r.target = base.final; }
      else {
        r.target = base.final > 0 ? baseCore * wMul(k) : base.final;

        r.we = r.wd != null ? roundTo(r.wd * ratio) : null;
      }
      r.m = r.wd != null ? monthly(k, r.wd, r.we, r.xFee) : null;
      r.x = nightly(state.channels[k], r.xFee);
      out.ch[k] = r;
    });
    last = out;
    return out;
  }

      function gb(B) {
        return '<span class="k">게스트 결제 · ' + (+state.basePeople) + '명 기준</span><span class="v">' + won(B.guest) + '</span><span class="s">1박 순수익 ' + won(B.net) + '</span>' +
          (xn ? '<span class="xp"><span class="xk">' + pe + '명 (추가 ' + xn + '명)</span><span class="xv">' + won(B.guest + r.x.guest * xn) + '</span><span class="xs">1박 순수익 ' + won(B.net + r.x.net * xn) + '</span></span>' : '');
      }
      html(k + "-wdm", gb(m.wdB));
      html(k + "-wem", gb(m.weB));
      html(k + "-final", won(m.final));
      var diff = m.final - all.base.final;
      html(k + "-side", taxPills(m.tax).replace(/<\/span><span/, '</span><span'));
      html(k + "-fsub", isA ? '다른 OTA는 이 금액 × 가중치에 맞춰져요' : '기준보다 ' + signed(diff) + '원' + (all.base.final > 0 ? ' (' + (diff >= 0 ? "+" : "") + pct(diff / all.base.final * 100) + ')' : '') + ' · 가중치 목표 ' + won(r.target));
      html(k + "-wnote", +ch.weight ? '가중치 0% 기준보다 순수익을 ' + pct(+ch.weight) + ' 더 남겨요' : '다른 OTA와 같은 순수익');
      // 프로모션 결합
      var on = ch.promos.filter(function (p) { return p.on; });
      html(k + "-disc", on.length ? '결합 할인 −' + pct((1 - discountFactor(ch)) * 100) : '할인 없음');
      var otaOn = on.filter(function (p) { return p.funder === "ota"; });
      html(k + "-disccalc", (!on.length ? '적용 중인 프로모션이 없어요' : ch.stack === "add"
        ? '합산: ' + on.map(function (p) { return pct(+p.rate); }).join(" + ") + ' = <b>' + pct((1 - discountFactor(ch)) * 100) + '</b> 한 번에 할인'
        : '곱연산: 1 − ' + on.map(function (p) { return "(1 − " + pct(+p.rate) + ")"; }).join(" × ") + ' = <b>' + pct((1 - discountFactor(ch)) * 100) + '</b>') +
        (otaOn.length ? '<br>트립 쿠폰 ' + pct(otaOn.reduce(function (a, p) { return a + (+p.rate || 0); }, 0)) + '는 게스트 결제가만 낮추고 정산은 숙소 부담 할인 −' + pct((1 - hostFactor(ch)) * 100) + ' 기준' : '') +
        '<br>정산: (게시가 × (1 − 숙소 부담 할인)) × (1 − 수수료 ' + pct(effComm(ch)) + ')' + (ch.cleanComm ? ' · 청소비 포함' : ' · 청소비는 수수료 없이 그대로'));
      // 청소비 · 인원
      var cl = m.clean;
      html(k + "-xcalc", (cl.price > 0 ? '청소비 게스트 결제 <b>' + won(cl.guest) + '</b> → 내 몫 <b>' + won(cl.net) + '</b>' + (ch.cleanComm ? '' : ' (수수료 없음)') : '청소비 미징수') +
        '<br>1인 추가 게스트 결제 <b>' + won(r.x.guest) + '</b> → 내 몫 <b>' + won(r.x.net) + '</b>');
      // 숙박 예시
      var day = state.ex.day, nb = day === "weekday" ? m.wdB : m.weB, extraN = Math.max(0, state.ex.people - (+state.basePeople || 0));
      html(k + "-stayh", '숙박 예시 · ' + (day === "weekday" ? "평일" : "주말") + ' · ' + state.ex.people + '명' + (extraN ? ' (추가 ' + extraN + '명)' : ''));
      var rows = [1, 2, 3, 4].map(function (n) {
        var g = n * (nb.guest + r.x.guest * extraN) + cl.guest, net = n * (nb.net + r.x.net * extraN) + cl.net;
        return '<tr><td>' + n + '박</td><td>' + comma(n * (nb.price + r.xFee * extraN) + cl.price) + '</td><td class="hi">' + comma(g) + '</td><td>' + comma(net) + '</td></tr>';
      }).join("");
      html(k + "-stay", '<table class="t"><thead><tr><th></th><th>게시가 합계</th><th>게스트 결제</th><th>내 순수익</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<p class="note" style="margin-top:4px">청소비 1회 포함 · 1박 순수익은 수수료만 뺀 금액이에요.</p>');
      // 1박 계산 과정
      html(k + "-proc", '<table class="t"><thead><tr><th></th><th>평일</th><th>주말</th></tr></thead><tbody>' +
        '<tr><td>게시가</td><td>' + comma(m.wdB.price) + '</td><td>' + comma(m.weB.price) + '</td></tr>' +
        '<tr class="minus"><td>할인 −' + pct((1 - m.wdB.df) * 100) + '</td><td>−' + comma(m.wdB.price - m.wdB.guest) + '</td><td>−' + comma(m.weB.price - m.weB.guest) + '</td></tr>' +
        '<tr><td>게스트 결제가</td><td>' + comma(m.wdB.guest) + '</td><td>' + comma(m.weB.guest) + '</td></tr>' +
        (m.wdB.base !== m.wdB.guest ? '<tr><td>정산 기준액<span class="s">트립 쿠폰은 트립 부담</span></td><td>' + comma(m.wdB.base) + '</td><td>' + comma(m.weB.base) + '</td></tr>' : '') +
        '<tr class="minus"><td>수수료 ' + pct(effComm(ch)) + '</td><td>−' + comma(m.wdB.fee) + '</td><td>−' + comma(m.weB.fee) + '</td></tr>' +
        '<tr class="tot"><td>1박 순수익</td><td>' + comma(m.wdB.net) + '</td><td>' + comma(m.weB.net) + '</td></tr></tbody></table>' +
        (k === "trip" ? tripCheck(ch, m.wdB, cl) : ''));
      // 월 내역
      html(k + "-monh", '한 달 · ' + (+state.nights.weekday + +state.nights.weekend) + '박 · 청소 ' + m.bookings + '회');
      html(k + "-mon", '<table class="t"><tbody>' +
        '<tr><td>게스트 결제 총액<span class="s">' + ['객실 ' + comma(m.guest - m.cleanGuest - m.extraGuest)].concat(m.cleanGuest ? ['청소비 ' + comma(m.cleanGuest)] : [], m.extraGuest ? ['추가 인원 ' + comma(m.extraGuest) + ' (' + (Math.round(m.xN * 10) / 10) + '명·박)'] : []).join(' · ') + '</span></td><td>' + comma(m.guest) + '</td></tr>' +
        (Math.abs(m.revenue - m.guest) > 1 ? '<tr><td>정산 기준 매출<span class="s">트립 쿠폰 제외 · 세금 계산 기준</span></td><td>' + comma(m.revenue) + '</td></tr>' : '') +
        '<tr class="minus"><td>플랫폼 수수료</td><td>−' + comma(m.fee) + '</td></tr>' +
        [["rent", "월세"], ["util", "공과금·기타"], ["clean", "청소 (" + m.bookings + "회)"]].map(function (g) {
          var G = m.costGroups[g[0]];
          return '<tr class="minus"><td>' + g[1] + (G.names.length > 1 || g[0] !== "rent" ? '<span class="s">' + (G.names.map(esc).join(" · ") || "없음") + '</span>' : '') + '</td><td>−' + comma(G.sum) + '</td></tr>';
        }).join("") +
        '<tr class="minus"><td>부가세</td><td>−' + comma(m.vat) + '</td></tr>' +
        '<tr class="minus"><td>종합소득세 + 지방세</td><td>−' + comma(m.incomeTax) + '</td></tr>' +
        '<tr class="tot"><td>월 최종 순수익</td><td>' + comma(m.final) + '</td></tr></tbody></table>');
      var t = m.tax;
      html(k + "-tax", '<table class="t"><tbody>' +
        '<tr><td>연 매출 (정산 기준)</td><td>' + comma(t.gross) + '</td></tr>' +
        '<tr><td>소득세 수입금액</td><td>' + comma(t.revenue) + '</td></tr>' +
        '<tr class="minus"><td>' + (t.method === "simple" ? "단순" : "기준") + '경비율 ' + pct(t.expenseRatio) + '</td><td>−' + comma(t.ratioExpense) + '</td></tr>' +
        (t.costExpense ? '<tr class="minus"><td>주요경비</td><td>−' + comma(t.costExpense) + '</td></tr>' : '') +
        '<tr><td>사업소득금액' + (t.capApplied ? '<span class="s">상한 ' + t.capMult + '배 적용</span>' : '') + '</td><td>' + comma(t.income) + '</td></tr>' +
        '<tr><td>종합소득세' + (t.penalty ? '<span class="s">무기장가산세 포함</span>' : '') + '</td><td>' + comma(t.incomeTax) + '</td></tr>' +
        '<tr class="tot"><td>연 세금 합계 (부가세 포함)</td><td>' + comma(t.totalTax) + '</td></tr></tbody></table>' +
        '<p class="note" style="margin-top:4px">4,800만 원 미만이면 간이과세 부가세 면제. 국세청 551007 경비율 기준 추정이에요.</p>');
    });
  }

  // 트립닷컴 게스트 화면 '요금 정보'와 관리자 '요금 명세' 모양 그대로 1박(평일) 예약 1건을 풀어 보여 줌
  function tripCheck(ch, B, cl) {
    var on = ch.promos.filter(function (p) { return p.on; });
    var host = on.filter(function (p) { return p.funder !== "ota"; }), ota = on.filter(function (p) { return p.funder === "ota"; });
    var P = B.price, afterHost = B.base, guestRoom = B.guest, vat = guestRoom / 11, rows = '', cur = afterHost;
    host.forEach(function (p) { rows += '<tr class="minus"><td>' + esc(p.name) + ' ' + pct(+p.rate) + '<span class="s">게시가 × ' + pct(+p.rate) + '</span></td><td>−' + comma(P * (+p.rate) / 100) + '</td></tr>'; });
    ota.forEach(function (p) { var amt = cur * (+p.rate) / 100; cur -= amt; rows += '<tr class="minus"><td>' + esc(p.name) + ' ' + pct(+p.rate) + '<span class="s">트립 부담 · 할인 후 금액 × ' + pct(+p.rate) + '</span></td><td>−' + comma(amt) + '</td></tr>'; });
    var guestT = '<p class="sec-t" style="margin-top:10px">트립 게스트 화면 · 평일 1박 1건</p><table class="t"><tbody>' +
      '<tr><td>객실 요금<span class="s">게시가 − 부가가치세</span></td><td>' + comma(P - vat) + '</td></tr>' + rows +
      '<tr><td>부가가치세<span class="s">게스트 객실 결제 ÷ 11</span></td><td>' + comma(vat) + '</td></tr>' +
      (cl.price ? '<tr><td>청소비</td><td>' + comma(cl.guest) + '</td></tr>' : '') +
      '<tr class="tot"><td>총 금액</td><td>' + comma(guestRoom + cl.guest) + '</td></tr></tbody></table>';
    var settleT = '<p class="sec-t" style="margin-top:10px">트립 관리자 요금 명세 · 정산</p><table class="t"><tbody>' +
      '<tr><td>원래 객실 요금 (세금 포함)</td><td>' + comma(P) + '</td></tr>' +
      '<tr class="minus"><td>할인 (숙소 부담 합계 ' + pct((1 - B.hf) * 100) + ')</td><td>−' + comma(P - afterHost) + '</td></tr>' +
      '<tr><td>최종 객실 요금<span class="s">부가세 ' + comma(afterHost / 11) + ' 포함</span></td><td>' + comma(afterHost) + '</td></tr>' +
      (cl.price ? '<tr><td>청소비 (예약 단위)</td><td>+' + comma(cl.base) + '</td></tr>' : '') +
      '<tr class="tot"><td>지급액</td><td>' + comma(afterHost + cl.base) + '</td></tr>' +
      '<tr class="minus"><td>수수료 ' + pct(effComm(ch)) + '<span class="s">객실 요금에만 · 명세에는 안 보임 (가정)</span></td><td>−' + comma(B.fee + cl.fee) + '</td></tr>' +
      '<tr class="tot"><td>내 순수익</td><td>' + comma(B.net + cl.net) + '</td></tr></tbody></table>';
    return guestT + settleT;
  }

  function applyViews() { VIEWS.forEach(function (v) { document.body.classList.toggle("hide-" + v[0], !state.view[v[0]]); }); }
  function renderAll() { applyViews(); renderTop(); renderDrawer(); renderCards(); renderOutputs(); }

  /* ---------- 이벤트 ---------- */
  function setPath(path, val) { var p = path.split("."), o = state; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }
  function readVal(el) { var t = el.getAttribute("data-t"); return t === "bool" ? el.checked : (t === "num" || t === "dec") ? parseNum(el.value) : el.value; }

  // 일반 설정값: 입력하는 대로 바로 반영 (가격 칸 제외)
  document.addEventListener("input", function (e) {
    var el = e.target, path = el.getAttribute && el.getAttribute("data-k");
    if (!path || el.type === "checkbox" || el.tagName === "SELECT") return;
    setPath(path, readVal(el)); save(); renderOutputs();
  });
  // 가격 · 인원 추가 요금: 칸을 벗어날 때(또는 Enter) 확정 → 그 OTA가 기준이 되고 나머지가 맞춰짐
  document.addEventListener("change", function (e) {
    var el = e.target;
    var pr = el.getAttribute && el.getAttribute("data-price");
    if (pr) {
      var p = pr.split("."), k = p[0], cur = last.ch[k], v = parseNum(el.value);
      if (v <= 0) { renderOutputs(); return; }
      state.aWd = p[1] === "wd" ? v : (cur.wd || v);
      state.aWe = p[1] === "we" ? v : (cur.we || v);
      state.anchor = k;
      save(); renderOutputs(CH_KEYS.filter(function (x) { return x !== k; }));
      el.value = comma(v);
      return;
    }
    var path = el.getAttribute && el.getAttribute("data-k");
    if (!path) return;
    setPath(path, readVal(el)); save();
    if (/promos\.\d+\.on$/.test(path)) el.closest(".promo").classList.toggle("off", !el.checked);
    renderOutputs();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches && e.target.matches("input[data-price], input[data-xfee]")) e.target.blur(); });
  document.addEventListener("focusout", function (e) {
    var el = e.target;
    if (el.tagName === "INPUT" && el.getAttribute("data-t") === "num" && !el.getAttribute("data-price") && !el.getAttribute("data-xfee")) el.value = comma(parseNum(el.value));
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), key = b.getAttribute("data-key");
    if (act === "view") { state.view[key] = !state.view[key]; b.setAttribute("aria-pressed", state.view[key]); applyViews(); save(); return; }
    if (act === "drawer") { state.drawer = !state.drawer; b.setAttribute("aria-expanded", state.drawer); renderDrawer(); renderOutputs(); save(); return; }
    if (act === "exday") { state.ex.day = key; renderTop(); renderOutputs(); save(); return; }
    if (act === "people") { state.ex.people = Math.min(+state.maxPeople || 8, Math.max(1, state.ex.people + +key)); renderOutputs(); save(); return; }
    if (act === "addpromo") state.channels[key].promos.push({ name: "새 할인", rate: 5, on: true, funder: "host" });
    else if (act === "delpromo") { var q = key.split("."); state.channels[q[0]].promos.splice(+q[1], 1); }
    else if (act === "addcost") state.costs.push({ name: "새 비용", amount: 0, unit: "month", proof: false, wht: false });
    else if (act === "delcost") state.costs.splice(+key, 1);
    else if (act === "reset") {
      if (b.getAttribute("data-armed") !== "1") { b.setAttribute("data-armed", "1"); b.textContent = "한 번 더 누르면 초기화돼요"; return; }
      state = defaults(); state.drawer = true;
    } else return;
    save(); renderAll();
    if (act === "addpromo") { var n = state.channels[key].promos.length - 1, el = document.getElementById(key + "-pn-" + n); if (el) { el.focus(); el.select(); } }
  });

  renderAll();
})();
</script>

</body>
</html>
