<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<title>레이트 데스크</title>
<style>
:root {
  --bg: #F2F4F6;
  --card: #FFFFFF;
  --ink: #191F28;
  --sub: #4E5968;
  --faint: #6B7684;
  --line: #E5E8EB;
  --line2: #F2F4F6;
  --accent: #0E6B5C;
  --accent-ink: #0A5246;
  --accent-soft: #E3F1EE;
  --gold-bg: #FBF6EC;
  --gold-line: #EAD9B8;
  --gold-ink: #6B4708;
  --gold-chip: #FBEFD9;
  --warn-bg: #FDF0EC;
  --warn-ink: #9A3B26;
  --chip-ab: #F3AFAF; --chip-ab-ink: #7A2020;
  --chip-bk: #14315C; --chip-bk-ink: #FFFFFF;
  --chip-tr: #A9D8ED; --chip-tr-ink: #133F52;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 20px calc(24px + env(safe-area-inset-bottom));
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; height: 56px; flex: none; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.back {
  display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -10px; padding: 0 10px;
  border: none; background: none; font-size: 14.5px; font-weight: 600; color: var(--ink); border-radius: 10px;
}
.back svg { width: 20px; height: 20px; }
.progress { display: flex; gap: 6px; }
.progress span { width: 28px; height: 4px; border-radius: 2px; background: #D5DAE1; }
.progress span.on { background: var(--accent); }
.icon-link {
  display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px;
  border: none; background: none; border-radius: 10px; color: var(--sub);
}
.icon-link svg { width: 22px; height: 22px; }

/* type */
.step-no { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--accent); }
h1 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }
.lead { margin: 8px 0 0; font-size: 14px; color: var(--sub); }
h2.sec { margin: 28px 0 10px; font-size: 16px; font-weight: 700; }
.small { font-size: 12.5px; color: var(--sub); }
.note { margin: 12px 2px 0; font-size: 12px; line-height: 1.65; color: var(--faint); }

/* cards */
.card { background: var(--card); border-radius: 18px; padding: 18px; }
.card + .card { margin-top: 12px; }
.mt { margin-top: 20px; }
.mt-s { margin-top: 12px; }

/* choice */
.choices { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.choice {
  text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; gap: 14px; align-items: flex-start;
}
.choice[aria-pressed="true"] { border-color: var(--accent); }
.radio { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B0B8C1; margin-top: 2px; }
.choice[aria-pressed="true"] .radio { border: 7px solid var(--accent); }
.choice-title { display: block; font-size: 17px; font-weight: 700; }
.choice-desc { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.55; color: var(--sub); }

/* big input */
.big-label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.big-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.big-field input {
  border: none; outline: none; background: none; font-size: 34px; font-weight: 700; width: 100%; min-width: 0; padding: 0;
  font-variant-numeric: tabular-nums;
}
.big-field span { font-size: 20px; font-weight: 600; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; margin-top: 8px; }
.kv > span:first-child { color: var(--sub); }
.kv.strong > span:last-child { font-weight: 700; color: var(--accent); }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: #E5E8EB; border-radius: 12px; padding: 4px; }
.card .seg { background: var(--bg); }
.seg button {
  height: 40px; border: none; border-radius: 9px; background: none; font-size: 13.5px; font-weight: 500; color: var(--sub);
  white-space: nowrap; padding: 0 6px;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

/* stepper */
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1;
}
.stepper input {
  width: 64px; text-align: center; border: none; background: none; font-size: 18px; font-weight: 700; padding: 0;
  font-variant-numeric: tabular-nums;
}
.stepper .val { min-width: 64px; text-align: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* field */
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--sub); }
.box-input { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 44px; background: var(--card); }
.box-input input { width: 100%; min-width: 0; border: none; background: none; font-size: 15px; font-weight: 600; color: var(--ink); padding: 0; outline: none; font-variant-numeric: tabular-nums; }
.box-input:focus-within { border-color: var(--accent); }
.box-input span { color: var(--ink); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* primary */
.spacer { flex-grow: 1; min-height: 24px; }
.primary {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 16px; border: none;
  background: var(--accent); color: #FFFFFF; font-size: 17px; font-weight: 700;
}
.primary:active { background: var(--accent-ink); }
.settings-card {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 16px 18px; margin-bottom: 28px;
  border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: left; color: var(--ink);
}
.settings-card:active { background: var(--line2); }
.settings-card .gear-wrap {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent);
}
.settings-card .gear-wrap svg { width: 24px; height: 24px; }
.settings-card > svg { flex: none; width: 20px; height: 20px; color: #B0B8C1; }
.settings-card .menu-title { font-size: 16px; font-weight: 700; }
.text-link {
  align-self: center; border: none; background: none; font-size: 13.5px; font-weight: 500; color: var(--accent);
  padding: 12px; text-decoration: underline; text-underline-offset: 3px;
}
.text-link.muted { color: var(--sub); }

/* channel list */
.chip {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
}
.chip.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.chip.ab { background: var(--chip-ab); color: var(--chip-ab-ink); }
.chip.bk { background: var(--chip-bk); color: var(--chip-bk-ink); }
.chip.tr { background: var(--chip-tr); color: var(--chip-tr-ink); }
.list { background: var(--card); border-radius: 18px; overflow: hidden; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
.list-row + .list-row { border-top: 1px solid var(--line2); }
.grow { flex-grow: 1; min-width: 0; }
.ch-name { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.ch-price { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11.5px; font-weight: 600; color: var(--sub); background: var(--line2); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag.gold { color: #8A5A0B; background: var(--gold-chip); }
.tag.green { color: var(--accent-ink); background: var(--accent-soft); }
.tag.warn { color: var(--warn-ink); background: var(--warn-bg); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.tile { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; color: var(--accent-ink); }
.tile .t-label { font-size: 12.5px; }
.tile .t-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* menu */
.menu-row {
  display: flex; align-items: center; gap: 12px; padding: 16px 18px; width: 100%; border: none; background: none; text-align: left;
}
.menu-row + .menu-row { border-top: 1px solid var(--line2); }
.menu-row:active { background: var(--line2); }
.menu-title { font-size: 15px; font-weight: 600; }
.menu-desc { font-size: 12.5px; color: var(--sub); }
.menu-row svg { flex: none; width: 18px; height: 18px; color: #B0B8C1; }

/* ledger lines */
.line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
.line:last-child { border-bottom: none; }
.line > span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.line.minus > span:last-child { color: var(--sub); }
.line.total { border-top: 1.5px solid var(--ink); border-bottom: none; margin-top: 4px; padding-top: 14px; font-weight: 700; align-items: baseline; }
.line.total > span:last-child { font-size: 22px; color: var(--accent); }
.line.sub > span { font-size: 13px; color: var(--sub); }
.big-figure { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* breakdown flow */
.flow-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.flow-head .grow { font-size: 15.5px; font-weight: 700; }

/* table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { font-size: 12px; font-weight: 600; color: var(--sub); text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--line2); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td .tag { margin-left: 4px; }

/* settings */
.ch-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.ch-head .grow { font-size: 15.5px; font-weight: 700; }
.weight-box { margin-top: 14px; background: var(--gold-bg); border-radius: 12px; padding: 12px 14px; }
.weight-box .w-label { font-size: 14px; font-weight: 700; color: var(--gold-ink); }
.weight-box .stepper button { width: 40px; height: 40px; border-radius: 10px; border-color: var(--gold-line); font-size: 18px; }
.weight-box .val { min-width: 54px; font-size: 17px; color: var(--gold-ink); }
.weight-box p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: #7A5A1E; }
.promo-title { margin: 16px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--sub); }
.promo-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.promo-row .name { flex: 1 1 auto; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 14px; background: var(--card); }
.promo-row .rate { flex: none; width: 70px; height: 42px; padding: 0 8px; }
.promo-row .rate input { text-align: right; font-size: 14px; }
.promo-row.off .name, .promo-row.off .rate { opacity: 0.5; }
.switch { flex: none; width: 46px; height: 28px; border-radius: 14px; border: none; background: #D5DAE1; position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }
.del { flex: none; width: 32px; height: 42px; border: none; background: none; color: #8B95A1; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.del svg { width: 18px; height: 18px; }
.cost-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.cost-row .proof { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--sub); white-space: nowrap; }
.cost-row .wht-row { flex-basis: 100%; display: flex; align-items: center; gap: 10px; background: var(--line2); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; font-weight: 600; }
.cost-row .wht-row .small { font-weight: 400; }
.cost-row .break { flex-basis: 100%; height: 0; }
.cost-row .name { flex: 1 1 0; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 14px; font-weight: 600; background: var(--card); }
.cost-row .amount { flex: 1 1 0; min-width: 0; }
.cost-row .amount input { text-align: right; }
.cost-row .unit { flex: none; width: 104px; padding: 0 8px; font-size: 13.5px; }
.add-btn {
  width: 100%; height: 44px; margin-top: 6px; border: 1.5px dashed #C9D1D9; border-radius: 10px; background: none;
  font-size: 13.5px; font-weight: 600; color: var(--accent);
}
.ghost {
  width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; color: var(--sub);
}
.check { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; }
select.box-select { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 14px; font-weight: 600; background: var(--card); }

details.why { margin-top: 12px; }
details.why summary { cursor: pointer; font-size: 13px; color: var(--sub); list-style: none; padding: 6px 0; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "▸ "; }
details.why[open] summary::before { content: "▾ "; }

@media (min-width: 720px) {
  body { padding-top: 24px; }
  .app { min-height: auto; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- 상수 ---------- */
  // 국세청 업종코드 551007(공유숙박업) 2023년 귀속 고시 경비율 — 매년 갱신되니 최신 고시 확인 필요
  var EXPENSE_RATIOS = { simple: 84.6, standard: 17.3 };
  var SIMPLE_RATIO_LIMIT = 36000000;       // 숙박업 단순경비율 적용 기준: 직전연도 수입금액 3,600만원 미만
  var SIMPLIFIED_VAT_THRESHOLD = 104000000; // 간이과세자 기준: 연 공급대가 1억 4백만원 미만
  var VAT_EXEMPT_THRESHOLD = 48000000;      // 간이과세자 납부면제: 연 공급대가 4,800만원 미만
  var SIMPLIFIED_VALUE_ADDED_RATE = 0.25;   // 간이과세 숙박업 부가가치율 25%
  var TAX_BRACKETS = [
    { limit: 14000000, rate: 0.06, deduction: 0 },
    { limit: 50000000, rate: 0.15, deduction: 1260000 },
    { limit: 88000000, rate: 0.24, deduction: 5760000 },
    { limit: 150000000, rate: 0.35, deduction: 15440000 },
    { limit: 300000000, rate: 0.38, deduction: 19940000 },
    { limit: 500000000, rate: 0.40, deduction: 25940000 },
    { limit: 1000000000, rate: 0.42, deduction: 35940000 },
    { limit: Infinity, rate: 0.45, deduction: 65940000 }
  ];
  var STORE_KEY = "rate-desk-v2";
  var WHT_RATE = 0.033;                     // 사업소득 원천징수: 소득세 3% + 지방소득세 0.3%
  var CH_KEYS = ["airbnb", "booking", "trip"];
  var DAY_LABEL = { weekday: "평일", weekend: "주말" };

  function defaults() {
    return {
      mode: "price",            // price: 에어비앤비 가격부터 / net: 순수익부터
      priceInput: 137000,
      netInput: 110000,
      weekendMode: "pct",       // pct | direct
      weekendPct: 27,
      weekendDirectPrice: 174000,
      weekendDirectNet: 140000,
      day: "weekday",
      roundUnit: 100,
      channels: {
        airbnb:  { label: "에어비앤비", code: "AB", cls: "ab", commission: 15.5, processing: 0, weight: 0, stack: "multiply", cleaningFee: 0,
                   promos: [{ name: "조기예약 할인", rate: 5, on: true }] },
        booking: { label: "부킹닷컴", code: "BK", cls: "bk", commission: 15, processing: 2.5, weight: 5, stack: "multiply", cleaningFee: 0,
                   promos: [{ name: "베이직 할인", rate: 50, on: true }, { name: "모바일 할인", rate: 10, on: true }, { name: "지니어스 할인", rate: 10, on: true }] },
        trip:    { label: "트립닷컴", code: "TR", cls: "tr", commission: 15.5, processing: 0, weight: 8, stack: "add", cleaningFee: 0,
                   promos: [{ name: "모바일 할인", rate: 10, on: true }, { name: "회원 할인", rate: 15, on: true }] }
      },
      extra: { base: 4, max: 8, airbnbFee: 17219 },
      cleaning: { applyPromo: false },  // 청소비는 채널별 cleaningFee, 0원이면 받지 않음
      avgLOS: 2,                // 평균 숙박일수 — 예약(청소) 건수 추정용
      costs: [                  // 운영 비용 — unit: month(매달) | year(1년) | clean(청소 1회)
        { name: "월세", amount: 800000, unit: "month", proof: true, wht: false },
        { name: "청소 인건비", amount: 50000, unit: "clean", proof: true, wht: false },
        { name: "집기 구입비", amount: 0, unit: "year", proof: true, wht: false }
      ],
      nights: { weekday: 16, weekend: 8 },
      basis: "airbnb"
    };
  }

  /* ---------- 저장 ---------- */
  function load() {
    var d = defaults();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return d;
      var s = JSON.parse(raw);
      // 얕은 병합 + 채널 병합 (새 필드가 생겨도 깨지지 않게)
      var out = Object.assign(d, s);
      out.channels = defaults().channels;
      CH_KEYS.forEach(function (k) {
        if (s.channels && s.channels[k]) {
          var c = s.channels[k];
          ["commission", "processing", "weight", "cleaningFee"].forEach(function (f) { if (typeof c[f] === "number") out.channels[k][f] = c[f]; });
          if (Array.isArray(c.promos)) out.channels[k].promos = c.promos;
        }
      });
      out.extra = Object.assign(defaults().extra, s.extra || {});
      out.cleaning = Object.assign(defaults().cleaning, s.cleaning || {});
      // 예전 버전(에어비앤비 기준 청소비) 저장값 옮기기
      if (s.cleaning && s.cleaning.on && typeof s.cleaning.airbnbFee === "number" && !(s.channels && s.channels.airbnb && typeof s.channels.airbnb.cleaningFee === "number")) {
        CH_KEYS.forEach(function (k) { out.channels[k].cleaningFee = s.cleaning.airbnbFee; });
      }
      out.nights = Object.assign(defaults().nights, s.nights || {});
      out.costs = Array.isArray(s.costs) ? s.costs : defaults().costs;
      out.costs.forEach(function (ci) {
        if (typeof ci.proof !== "boolean") ci.proof = true;
        if (typeof ci.wht !== "boolean") ci.wht = false;
      });
      if (typeof s.avgLOS !== "number" && s.cleaning && typeof s.cleaning.avgLOS === "number") out.avgLOS = s.cleaning.avgLOS;
      return out;
    } catch (e) { return d; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  var state = load();

  /* ---------- 포맷 ---------- */
  function won(n) { return isFinite(n) ? Math.round(n).toLocaleString("ko-KR") + "원" : "—"; }
  function comma(n) { return isFinite(n) ? Math.round(n).toLocaleString("ko-KR") : ""; }
  function pct(n) { return (Math.round(n * 10) / 10).toLocaleString("ko-KR") + "%"; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function parseNum(v) {
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isFinite(n) ? n : 0;
  }
  function roundTo(v) {
    var u = state.roundUnit || 1;
    return isFinite(v) ? Math.round(v / u) * u : v;
  }

  /* ---------- 계산 ---------- */
  function effComm(ch) { return (ch.commission || 0) + (ch.processing || 0); }

  // 프로모션 결합: multiply = 차례로 적용(곱연산), add = 할인율을 더해 한 번에 적용(합산, 트립닷컴)
  function discountFactor(ch) {
    var on = ch.promos.filter(function (p) { return p.on; });
    if (ch.stack === "add") {
      var sum = on.reduce(function (a, p) { return a + (p.rate || 0); }, 0);
      return Math.max(0.01, 1 - sum / 100);
    }
    return on.reduce(function (a, p) { return a * (1 - (p.rate || 0) / 100); }, 1);
  }
  function keepRate(ch, applyDiscount) {
    var df = applyDiscount ? discountFactor(ch) : 1;
    return df * (1 - effComm(ch) / 100);
  }
  // 게시가 하나로 게스트 결제가·수수료·순수익 계산
  function breakdown(ch, price, applyDiscount) {
    var df = applyDiscount ? discountFactor(ch) : 1;
    var guest = price * df;
    var fee = guest * effComm(ch) / 100;
    return { price: price, df: df, guest: guest, fee: fee, net: guest - fee };
  }

  // 에어비앤비 평일·주말 게시가
  function airbnbPrices() {
    var ab = state.channels.airbnb;
    var k = keepRate(ab, true);
    var wd, we;
    if (state.mode === "price") {
      wd = state.priceInput;
      we = state.weekendMode === "pct" ? roundTo(wd * (1 + state.weekendPct / 100)) : state.weekendDirectPrice;
    } else {
      wd = roundTo(state.netInput / k);
      var weNet = state.weekendMode === "pct" ? state.netInput * (1 + state.weekendPct / 100) : state.weekendDirectNet;
      we = roundTo(weNet / k);
    }
    return { weekday: wd, weekend: we };
  }

  // 에어비앤비 기준 순수익을 다른 채널에서도 남기는 게시가 (가중치만큼 더)
  function priceFor(ch, baseNet, applyDiscount, keepExact) {
    if (keepExact != null) return keepExact;
    return roundTo(baseNet * (1 + ch.weight / 100) / keepRate(ch, applyDiscount));
  }

  function computeRates() {
    var ab = state.channels.airbnb;
    var abP = airbnbPrices();
    var out = { weekday: {}, weekend: {} };
    ["weekday", "weekend"].forEach(function (day) {
      var abB = breakdown(ab, abP[day], true);
      var baseNet = abB.net / (1 + ab.weight / 100);
      CH_KEYS.forEach(function (key) {
        var ch = state.channels[key];
        var price = key === "airbnb" ? abP[day] : priceFor(ch, baseNet, true);
        out[day][key] = breakdown(ch, price, true);
      });
    });
    return out;
  }

  function computeAddon(airbnbFee, applyDiscount) {
    var ab = state.channels.airbnb;
    var abB = breakdown(ab, airbnbFee, applyDiscount);
    var baseNet = abB.net / (1 + ab.weight / 100);
    var out = {};
    CH_KEYS.forEach(function (key) {
      var ch = state.channels[key];
      var price = key === "airbnb" ? airbnbFee : priceFor(ch, baseNet, applyDiscount);
      out[key] = breakdown(ch, price, applyDiscount);
    });
    return out;
  }

  // 한 달 청소(예약) 횟수 = 판매 박수 ÷ 평균 숙박일수, 반올림한 정수
  function cleaningsPerMonth() {
    var n = state.nights;
    return state.avgLOS > 0 ? Math.round((n.weekday + n.weekend) / state.avgLOS) : 0;
  }
  // 원천징수 대상이면 입력액을 '받는 분 실수령액'으로 보고, 원천세를 더한 총지급액이 실제 비용
  function costInfo(ci) {
    var a = parseNum(ci.amount);
    var wht = ci.proof !== false && !!ci.wht;
    var gross = wht ? a / (1 - WHT_RATE) : a;
    return { paid: a, wht: wht, tax: gross - a, gross: gross };
  }
  // 청소 1회당 드리는 인건비 (운영 비용 중 '청소 1회' 항목 합계, 원천세 포함)
  function laborPerCleaning() {
    return state.costs.reduce(function (a, ci) { return a + (ci.unit === "clean" ? costInfo(ci).gross : 0); }, 0);
  }

  function incomeTax(taxable) {
    if (taxable <= 0) return 0;
    var b = TAX_BRACKETS.find(function (b) { return taxable <= b.limit; });
    return Math.max(0, taxable * b.rate - b.deduction);
  }

  function computeMoney() {
    var rates = computeRates();
    var key = state.basis;
    var wd = rates.weekday[key], we = rates.weekend[key];
    var n = state.nights;
    var m = {
      guest: n.weekday * wd.guest + n.weekend * we.guest,
      fee: n.weekday * wd.fee + n.weekend * we.fee,
      net: n.weekday * wd.net + n.weekend * we.net,
      cleaning: null
    };
    var bookings = cleaningsPerMonth();
    m.bookings = bookings;
    m.room = { guest: m.guest, fee: m.fee, net: m.net };
    var cf = state.channels[key].cleaningFee || 0;
    if (cf > 0) {
      var c = breakdown(state.channels[key], cf, state.cleaning.applyPromo);
      m.cleaning = { bookings: bookings, per: c, guest: bookings * c.guest, fee: bookings * c.fee, net: bookings * c.net };
      m.guest += m.cleaning.guest; m.fee += m.cleaning.fee; m.net += m.cleaning.net;
    }
    // 운영 비용 (월 환산)
    m.costItems = state.costs.map(function (ci) {
      var info = costInfo(ci), a = info.gross;
      var monthly = ci.unit === "year" ? a / 12 : ci.unit === "clean" ? a * bookings : a;
      return { name: ci.name, unit: ci.unit, amount: a, paid: info.paid, wht: info.wht, whtTax: info.tax, monthly: monthly, proof: ci.proof !== false };
    }).filter(function (ci) { return ci.monthly > 0; });
    m.costs = m.costItems.reduce(function (a, ci) { return a + ci.monthly; }, 0);
    m.proofCosts = m.costItems.reduce(function (a, ci) { return a + (ci.proof ? ci.monthly : 0); }, 0);
    m.real = m.net - m.costs;

    // 1년 · 세금 — 매출은 게스트 결제액 기준
    var G = m.guest * 12;
    var F = m.fee * 12;
    var C = m.costs * 12;
    var CP = m.proofCosts * 12;
    var t = { gross: G, fees: F, costs: C, proofCosts: CP };
    t.taxType = G < SIMPLIFIED_VAT_THRESHOLD ? "simplified" : "general";
    if (t.taxType === "simplified") {
      t.vatExempt = G < VAT_EXEMPT_THRESHOLD;
      t.vat = t.vatExempt ? 0 : G * SIMPLIFIED_VALUE_ADDED_RATE * 0.1;
      t.revenue = G - t.vat;               // 소득세 수입금액(납부한 부가세 제외)
    } else {
      t.vatExempt = false;
      t.revenue = G / 1.1;                 // 공급가액
      t.vat = G - t.revenue;               // 매입세액공제 미반영
    }
    t.method = t.revenue < SIMPLE_RATIO_LIMIT ? "simple" : "standard";
    if (t.method === "simple") {
      t.expenseRatio = EXPENSE_RATIOS.simple;
      t.ratioExpense = t.revenue * t.expenseRatio / 100;
      t.feeExpense = 0;
      t.costExpense = 0;
    } else {
      t.expenseRatio = EXPENSE_RATIOS.standard;
      t.ratioExpense = t.revenue * t.expenseRatio / 100;
      t.feeExpense = F;                    // 플랫폼 수수료를 비용으로 차감
      t.costExpense = m.proofCosts * 12;   // 운영 비용 중 증빙 있는 것만 차감
    }
    t.income = Math.max(0, t.revenue - t.ratioExpense - t.feeExpense - t.costExpense);
    t.incomeTax = incomeTax(t.income);
    t.localTax = t.incomeTax * 0.1;
    t.totalTax = t.vat + t.incomeTax + t.localTax;
    t.preTax = G - F - C;                  // 세전 실제 수익
    t.afterTax = G - F - C - t.totalTax;   // 세후 실제 수익
    return { rates: rates, month: m, tax: t };
  }

  /* ---------- 아이콘 ---------- */
  var ICON = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* ---------- 라우팅 ---------- */
  var VIEWS = ["start", "input", "result", "breakdown", "extra", "cleaning", "money", "settings"];

    var h = (location.hash || "").replace("#", "");
    return VIEWS.indexOf(h) >= 0 ? h : "start";
  }
  function go(view) {
    if (view === "settings") settingsReturn = current() === "settings" ? settingsReturn : current();
    if (location.hash === "#" + view) render(); else location.hash = view;
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  /* ---------- 공통 조각 ---------- */
  function header(opts) {
    var left = opts.back
      ? '<button type="button" class="back" data-go="' + opts.back + '">' + ICON.back + (opts.backLabel || "") + '</button>'
      : '<span class="brand">레이트 데스크</span>';
    var right = "";
    if (opts.step) {
      right = '<div class="progress" aria-label="' + opts.step + ' / 3단계">' +
        [1, 2, 3].map(function (i) { return '<span class="' + (i <= opts.step ? "on" : "") + '"></span>'; }).join("") + '</div>';
    }
    if (opts.gear) right = '<button type="button" class="icon-link" data-go="settings" aria-label="설정">' + ICON.gear + '</button>';
    return '<div class="top">' + left + right + '</div>';
  }
  function chip(ch, sm) { return '<span class="chip ' + ch.cls + (sm ? " sm" : "") + '" aria-hidden="true">' + ch.code + '</span>'; }
  function weightTag(ch) { return ch.weight ? '<span class="tag gold">가중치 +' + pct(ch.weight) + '</span>' : ""; }
  function daySeg() {
    return '<div class="seg mt" role="group" aria-label="평일·주말">' +
      ["weekday", "weekend"].map(function (d) {
        return '<button type="button" data-day="' + d + '" aria-pressed="' + (state.day === d) + '">' + DAY_LABEL[d] + '</button>';
      }).join("") + '</div>';
  }
  function stackLabel(ch) { return ch.stack === "add" ? "합산" : "곱연산"; }

  /* ---------- 화면: 1단계 ---------- */
  function viewStart() {
    return header({ step: 1 }) +
      '<div style="margin-top:28px"><p class="step-no">1 / 3단계</p>' +
      '<h1>무엇을 기준으로<br>가격을 정할까요?</h1><p class="lead">나중에 언제든 바꿀 수 있어요.</p></div>' +
      '<div class="choices">' +
      choice("price", "에어비앤비 평일 가격부터", "지금 에어비앤비에 걸어둔 평일 가격을 넣으면 주말 가격, 부킹·트립 가격, 순수익이 나와요.") +
      choice("net", "원하는 순수익부터", "1박에 손에 쥐고 싶은 금액을 넣으면 채널마다 얼마에 걸어야 하는지 거꾸로 계산해요.") +
      '</div><div class="spacer"></div>' +
      '<button type="button" class="settings-card" data-go="settings">' +
      '<span class="gear-wrap">' + ICON.gear + '</span>' +
      '<span class="grow"><span class="menu-title" style="display:block">설정 먼저 확인하기</span>' +
      '<span class="menu-desc" style="display:block">수수료 · 프로모션 · 청소비 · 운영 비용</span></span>' + ICON.next + '</button>' +

    function choice(mode, title, desc) {

        '<span class="choice-desc">' + desc + '</span></span></button>';
    }
  }

  /* ---------- 화면: 2단계 ---------- */
  function viewInput() {
    var isPrice = state.mode === "price";

    return header({ back: "start", step: 2 }) +
      '<div style="margin-top:12px"><p class="step-no">2 / 3단계</p>' +
      '<h1>' + (isPrice ? "에어비앤비 평일 1박 가격을<br>입력하세요" : "평일 1박에 남기고 싶은<br>순수익을 입력하세요") + '</h1></div>' +
      '<div class="card mt">' +
      '<label class="big-label" for="main-input">' + (isPrice ? "에어비앤비 평일 1박 게시가" : "평일 1박 목표 순수익") + ' (' + state.extra.base + '명 기준)</label>' +
      '<div class="big-field"><input id="main-input" type="text" inputmode="numeric" autocomplete="off" data-num="' + (isPrice ? "priceInput" : "netInput") + '" value="' + comma(isPrice ? state.priceInput : state.netInput) + '"><span>원</span></div>' +
      '<div id="live-main"></div></div>' +

      '<div class="seg" role="group" aria-label="주말 정하는 방식">' +

  }
  function liveInput() {

        '<button type="button" data-wstep="' + key + '" data-delta="1" aria-label="' + ch.label + ' 가중치 1% 올리기">+</button></div></div>' +
        '<p id="wdesc-' + key + '">' + weightDesc(ch) + '</p></div>';
      return '<div class="card mt-s"><div class="ch-head">' + chip(ch, true) + '<span class="grow">' + ch.label + '</span>' +
        (key === "airbnb" ? '<span class="tag">기준 채널</span>' : "") + '</div>' +
        '<div class="grid2">' +
        '<label class="field">수수료<span class="box-input"><input type="text" inputmode="decimal" data-ch="' + key + ':commission" value="' + ch.commission + '"><span>%</span></span></label>' +
        '<label class="field">결제대행 수수료<span class="box-input"><input type="text" inputmode="decimal" data-ch="' + key + ':processing" value="' + ch.processing + '"><span>%</span></span></label>' +
        '<label class="field" style="grid-column:1 / -1">청소비 (예약 1건, 게스트에게 받는 돈)<span class="box-input"><input type="text" inputmode="numeric" data-ch="' + key + ':cleaningFee" value="' + comma(ch.cleaningFee) + '"><span>원</span></span></label>' +
        '</div>' + weight +
        '<p class="promo-title">프로모션 · 할인 ' + stackLabel(ch) + '</p>' + promos +
        '<button type="button" class="add-btn" data-promo-add="' + key + '">+ 프로모션 추가</button></div>';
    }).join("");
    return header({ back: settingsReturn === "settings" ? "result" : settingsReturn, backLabel: "돌아가기" }) +
      '<h1 style="margin-top:8px">설정</h1>' +
      '<p class="lead">바꾼 값은 이 기기에 자동 저장돼요.</p>' +
      cards +
      costCard() +
      '<div class="card mt-s"><div class="row-between"><label for="round-unit" style="font-size:14px">가격 반올림 단위</label>' +
      '<select id="round-unit" class="box-select" data-round>' + [1, 10, 100, 500, 1000].map(function (u) {
        return '<option value="' + u + '"' + (state.roundUnit === u ? " selected" : "") + '>' + comma(u) + '원</option>';
      }).join("") + '</select></div></div>' +
      '<p class="note">에어비앤비·부킹닷컴은 할인을 차례로 곱해서, 트립닷컴은 할인율을 더해서 적용해요. 부킹닷컴·트립닷컴 계약에 레이트 패리티(최저가 보장) 조항이 있는지도 확인하세요.</p>' +
      '<div class="spacer"></div><button type="button" class="ghost" data-reset>기본값으로 되돌리기</button>';
  }
  function whtDesc(ci) {
    var info = costInfo(ci);
    return info.wht
      ? "받는 분 실수령 " + won(info.paid) + " + 원천세 " + won(info.tax) + " = 실제 비용 " + won(info.gross)
      : "사업소득으로 지급하면 3.3%를 떼고 신고해야 비용으로 인정돼요";
  }
  function costCard() {
    var units = [["month", "매달"], ["year", "1년"], ["clean", "청소 1회"]];
    var rows = state.costs.map(function (ci, i) {
      return '<div class="cost-row">' +
        '<input class="name" type="text" aria-label="비용 이름" data-cost="' + i + ':name" value="' + esc(ci.name) + '">' +
        '<span class="proof"><span id="proof-l-' + i + '">증빙 ' + (ci.proof !== false ? "있음" : "없음") + '</span>' +
        '<button type="button" class="switch" role="switch" aria-checked="' + (ci.proof !== false) + '" aria-label="' + esc(ci.name) + ' 증빙 있음" data-cost-proof="' + i + '"></button></span>' +
        '<span class="break" aria-hidden="true"></span>' +
        '<span class="box-input amount"><input type="text" inputmode="numeric" aria-label="' + esc(ci.name) + ' 금액" data-cost="' + i + ':amount" value="' + comma(ci.amount) + '"><span>원</span></span>' +
        '<select class="box-select unit" aria-label="' + esc(ci.name) + ' 주기" data-cost="' + i + ':unit">' +
        units.map(function (u) { return '<option value="' + u[0] + '"' + (ci.unit === u[0] ? " selected" : "") + '>' + u[1] + '</option>'; }).join("") +
        '</select>' +
        '<button type="button" class="del" aria-label="' + esc(ci.name) + ' 삭제" data-cost-del="' + i + '">' + ICON.x + '</button>' +
        (ci.proof !== false
          ? '<div class="wht-row"><span class="grow">원천징수 3.3%<br><span class="small" id="wht-d-' + i + '">' + whtDesc(ci) + '</span></span>' +
            '<button type="button" class="switch" role="switch" aria-checked="' + !!ci.wht + '" aria-label="' + esc(ci.name) + ' 원천징수" data-cost-wht="' + i + '"></button></div>'
          : "") +
        '</div>';
    }).join("");
    return '<div class="card mt-s"><div class="ch-head"><span class="grow">운영 비용</span></div>' +
      '<p class="small" style="margin:-8px 0 8px">월세처럼 매달 나가는 돈, 1년에 한 번 드는 돈, 청소할 때마다 드리는 돈을 넣으면 실제 수익에서 빼요. 증빙이 있는 비용만 세금 계산 때 비용으로 인정해요.</p>' +
      rows +
      '<button type="button" class="add-btn" data-cost-add>+ 비용 추가</button>' +
      '<div class="row-between" style="margin-top:14px"><label for="avg-los" style="font-size:14px">평균 숙박일수<br><span class="small">청소 횟수 = 판매 박수 ÷ 평균 숙박일수</span></label>' +
      '<span class="box-input" style="width:96px"><input id="avg-los" type="text" inputmode="decimal" data-num="avgLOS" value="' + state.avgLOS + '"><span>박</span></span></div>' +
      '</div>';
  }
  function weightDesc(ch) {
    return ch.weight
      ? "에어비앤비보다 순수익이 " + pct(ch.weight) + " 더 남도록 게시가를 올려요."
      : "에어비앤비와 순수익이 똑같아지도록 게시가를 맞춰요.";
  }

  /* ---------- 렌더 ---------- */
  var app = document.getElementById("app");
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }
  function render() {
    var v = current();
    var html = {
      start: viewStart, input: viewInput, result: viewResult, breakdown: viewBreakdown,
      extra: viewExtra, cleaning: viewCleaning, money: viewMoney, settings: viewSettings
    }[v]();
    app.innerHTML = html;
    live();
  }
  function live() {
    var v = current();
    if (v === "input") liveInput();
    if (v === "extra") liveExtra();
    if (v === "cleaning") liveCleaning();
    if (v === "money") liveMoney();
  }

  function setPath(path, value) {
    var parts = path.split(".");
    var cur = state;
    for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }
  function getPath(path) {
    return path.split(".").reduce(function (o, k) { return o[k]; }, state);
  }

  /* ---------- 이벤트 ---------- */
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    var d = t.dataset;
    if (d.go) { go(d.go); return; }
    if (d.mode) { state.mode = d.mode; save(); render(); return; }
    if (d.wmode) { state.weekendMode = d.wmode; save(); render(); return; }
    if (d.day) { state.day = d.day; save(); render(); return; }
    if (d.basis) { state.basis = d.basis; save(); render(); return; }
    if (d.step) {
      var v = Math.max(d.step === "weekendPct" ? -50 : 0, getPath(d.step) + Number(d.delta));
      setPath(d.step, v); save();
      var inp = app.querySelector('[data-num="' + d.step + '"]');
      if (inp) inp.value = v;
      live(); return;
    }
    if (d.wstep) {
      var ch = state.channels[d.wstep];
      ch.weight = Math.max(0, Math.min(100, ch.weight + Number(d.delta)));
      save();
      document.getElementById("w-" + d.wstep).textContent = "+" + ch.weight + "%";
      document.getElementById("wdesc-" + d.wstep).textContent = weightDesc(ch);
      return;
    }
    if (d.toggle) { setPath(d.toggle, !getPath(d.toggle)); save(); render(); return; }
    if (d.promoToggle) {
      var a = d.promoToggle.split(":"); var p = state.channels[a[0]].promos[+a[1]];
      p.on = !p.on; save();
      t.setAttribute("aria-checked", p.on);
      t.closest(".promo-row").classList.toggle("off", !p.on);
      return;
    }
    if (d.promoDel) {
      var b = d.promoDel.split(":"); state.channels[b[0]].promos.splice(+b[1], 1); save(); render(); return;
    }
    if (d.promoAdd) {
      state.channels[d.promoAdd].promos.push({ name: "새 프로모션", rate: 5, on: true }); save(); render();
      var rows = app.querySelectorAll('[data-promo^="' + d.promoAdd + ':"][data-promo$=":name"]');
      if (rows.length) { var last = rows[rows.length - 1]; last.focus(); last.select(); }
      return;
    }
    if (d.costProof !== undefined) {
      var ci = state.costs[+d.costProof]; ci.proof = ci.proof === false; save();
      var y = window.scrollY; render(); window.scrollTo(0, y);
      return;
    }
    if (d.costWht !== undefined) {
      var cw = state.costs[+d.costWht]; cw.wht = !cw.wht; save();
      t.setAttribute("aria-checked", cw.wht);
      var wd = document.getElementById("wht-d-" + d.costWht); if (wd) wd.textContent = whtDesc(cw);
      return;
    }
    if (d.costDel !== undefined) { state.costs.splice(+d.costDel, 1); save(); render(); return; }
    if (d.costAdd !== undefined) {
      state.costs.push({ name: "새 비용", amount: 0, unit: "month", proof: true, wht: false }); save(); render();
      var cs = app.querySelectorAll('[data-cost$=":name"]');
      if (cs.length) { var lc = cs[cs.length - 1]; lc.focus(); lc.select(); }
      return;
    }
    if (d.reset !== undefined) {
      state = defaults(); save(); render(); return;
    }
  });

  app.addEventListener("input", function (e) {
    var t = e.target, d = t.dataset;
    if (d.num) {
      setPath(d.num, parseNum(t.value)); save();
      if (current() === "cleaning") { var cc = document.getElementById("clean-count"); if (cc) { liveCleaningKeepFocus(t); return; } }
      live(); return;
    }
    if (d.ch) { var a = d.ch.split(":"); state.channels[a[0]][a[1]] = parseNum(t.value); save(); if (d.live !== undefined) liveCleaning(); return; }
    if (d.cost) {
      var c = d.cost.split(":"); var item = state.costs[+c[0]];
      item[c[1]] = c[1] === "amount" ? parseNum(t.value) : t.value; save();
      var wdd = document.getElementById("wht-d-" + c[0]); if (wdd) wdd.textContent = whtDesc(item);
      return;
    }
    if (d.promo) {
      var b = d.promo.split(":"); var p = state.channels[b[0]].promos[+b[1]];
      p[b[2]] = b[2] === "rate" ? parseNum(t.value) : t.value; save(); return;
    }
  });
  app.addEventListener("change", function (e) {
    if (e.target.dataset.round !== undefined) { state.roundUnit = Number(e.target.value); save(); }
    if (e.target.dataset.cost && /:unit$/.test(e.target.dataset.cost)) { state.costs[+e.target.dataset.cost.split(":")[0]].unit = e.target.value; save(); }
  });
  // 큰 금액 입력칸은 포커스가 빠지면 천 단위 쉼표로 정리
  app.addEventListener("focusout", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.ch && /:cleaningFee$/.test(t.dataset.ch)) {
      t.value = comma(state.channels[t.dataset.ch.split(":")[0]].cleaningFee);
    }
    if (t.dataset && t.dataset.cost && /:amount$/.test(t.dataset.cost)) {
      t.value = comma(state.costs[+t.dataset.cost.split(":")[0]].amount);
    }
    if (t.dataset && t.dataset.num) {
      var v = getPath(t.dataset.num);
      t.value = v >= 1000 ? comma(v) : String(v);
    }
  });

  render();

  // 계산 함수 노출 (검증용)
  window.__rateDesk = { computeRates: computeRates, computeMoney: computeMoney, computeAddon: computeAddon, state: function () { return state; } };
})();
</script>
</body>
</html>
